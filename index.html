<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nokia Lyrics Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="on.css">
</head>
<body>

  <div id="lcd">
    
    <div id="status-bar">
      <div id="play-btn">▶</div>
      <div id="record-dot"></div>
    </div>

     <div id="lcd-title">NokiNotes</div>
    <div id="lyrics">Press Play</div>
  </div>
    <div id="duration-bar">
    <div id="progress"></div>
  </div>
</div>
  
  <audio id="audio">
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <script src="ons.js"></script>
</body>
</html>
